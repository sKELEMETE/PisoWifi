table inet pisowifi {
    set authenticated_clients {
        type ipv4_addr . ether_addr
        flags timeout
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Allow local loopback
        iifname "lo" accept

        # Allow established and related connections
        ct state established,related accept

        # Allow DHCP server traffic from LAN interface (UDP 67/68)
        iifname "enxc817f552a5c6" udp sport 68 udp dport 67 accept

        # Allow local DNS traffic from LAN interface (UDP/TCP 53)
        iifname "enxc817f552a5c6" udp dport 53 accept
        iifname "enxc817f552a5c6" tcp dport 53 accept

        # Allow captive portal web traffic from LAN interface (HTTP 80, HTTPS 443)
        iifname "enxc817f552a5c6" tcp dport 80 accept
        iifname "enxc817f552a5c6" tcp dport 443 accept

        # Drop everything else from LAN: unauthorized clients cannot reach SSH or Admin API
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Allow established and related connections
        ct state established,related accept

        # Forward Internet traffic ONLY for authenticated IP+MAC pairs on the designated LAN interface
        iifname "enxc817f552a5c6" oifname "eth0" ip saddr . ether saddr @authenticated_clients accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    set authenticated_clients {
        type ipv4_addr . ether_addr
        flags timeout
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # Authenticated clients skip captive portal redirection
        iifname "enxc817f552a5c6" ip saddr . ether saddr @authenticated_clients return

        # Redirect unauthorized client DNS to local dnsmasq
        iifname "enxc817f552a5c6" udp dport 53 redirect to :53
        iifname "enxc817f552a5c6" tcp dport 53 redirect to :53

        # Redirect unauthorized client HTTP traffic to captive portal
        iifname "enxc817f552a5c6" tcp dport 80 redirect to :80
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "eth0" masquerade
    }
}
