server {
    listen 80 default_server;
    server_name _;

    root /opt/pisowifi/frontend/dist;
    index index.html;

    #
    # Android Captive Portal Detect
    #
    location ~ ^/generate_204 {
        return 302 http://10.0.0.1/;
    }

    #
    # Apple Captive Portal Detect
    #
    location = /hotspot-detect.html {
        return 302 http://10.0.0.1/;
    }

    #
    # Windows Captive Portal Detect
    #
    location = /connecttest.txt {
        return 302 http://10.0.0.1/;
    }

    location = /ncsi.txt {
        return 302 http://10.0.0.1/;
    }

    #
    # API
    #
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve sound effects directly from disk bypassing FastAPI process
    location /api/sfx/ {
        alias /opt/pisowifi/sfx/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    #
    # React App Routing
    #
    location / {
        try_files $uri $uri/ /index.html;
    }
}
